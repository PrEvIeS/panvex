# Panvex deployment for vpn_senko (panvex.azzazelvpn.ru).
#
# Topology:
#   traefik (existing, in /root/vpn-setup) on :443
#     └─ Host(`panvex.azzazelvpn.ru`) → web:80 (nginx)
#                                       ├─ /          → SPA static assets
#                                       └─ /api/      → backend:8080 (control-plane HTTP)
#   backend gRPC :8443 → host :9443     (auto-TLS from embedded CA — agents bootstrap into this CA)
#
# This compose joins the existing `proxy` docker network created by the
# traefik stack so traefik can reach the `web` container by its docker name.
#
# Storage:        SQLite (volume panvex_sqlite_data) — chosen for the 1.9 GB-RAM box.
# TLS for HTTP:   `proxy` mode — traefik terminates with the existing letsencrypt resolver.
# TLS for gRPC:   the control-plane mints its own certificate from the embedded CA
#                 at startup; agents pin that CA via their bootstrap state.
#
# Bootstrap:
#   PANVEX_ENCRYPTION_KEY=$(openssl rand -hex 32) docker compose -f docker-compose.senko.yml up -d
#   docker compose -f docker-compose.senko.yml exec backend ./panvex-control-plane \
#     bootstrap-admin -storage-driver sqlite -storage-dsn /var/lib/panvex/panvex.db \
#     -username admin -password '<pw>'

services:
  backend:
    image: panvex-control-plane:senko
    build:
      context: ../..
      dockerfile: Dockerfile
      target: control-plane
    container_name: panvex-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Refuses to start without an explicit, non-default key.
      PANVEX_ENCRYPTION_KEY: ${PANVEX_ENCRYPTION_KEY:?PANVEX_ENCRYPTION_KEY is required}
    # The Dockerfile already has ENTRYPOINT ["./panvex-control-plane"], so
    # `command` only carries flags. Listing the binary again would shift it
    # into argv[1], where Go's flag.Parse treats it as a non-flag and stops
    # — silently dropping `-config` and falling back to the relative default
    # DSN `data/panvex.db` (which is unwritable for the non-root `panvex`
    # user under WORKDIR /app).
    command:
      - -config
      - /etc/panvex/config.toml
    volumes:
      - ./config.toml:/etc/panvex/config.toml:ro
      - panvex_sqlite_data:/var/lib/panvex
    ports:
      # gRPC is exposed directly with auto-minted TLS from the embedded CA.
      # UFW must allow tcp/9443 (handled in deploy.sh).
      - "9443:8443"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
    # Must exceed cmd/control-plane controlPlaneShutdownGraceMin so the
    # audit-event drain finishes before docker sends SIGKILL.
    stop_grace_period: 45s

  web:
    image: panvex-web:senko
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
    container_name: panvex-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # The web container speaks HTTP on :80; traefik terminates TLS upstream.
      - "traefik.http.services.panvex.loadbalancer.server.port=80"
      - "traefik.http.routers.panvex.rule=Host(`panvex.azzazelvpn.ru`)"
      - "traefik.http.routers.panvex.entrypoints=websecure"
      - "traefik.http.routers.panvex.tls.certresolver=myresolver"
      - "traefik.http.routers.panvex.service=panvex"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  # MTProxy server. Fake-TLS mode (ee-prefix) with SNI = panel domain.
  # Port :2443 because traefik owns :443 on this host. The local API
  # binds inside the container on 9091 and is consumed by panvex-agent
  # over the docker bridge — never exposed to the host or internet.
  telemt:
    image: ghcr.io/telemt/telemt:3.4.12
    container_name: telemt
    restart: unless-stopped
    working_dir: /etc/telemt
    # Telemt persists user state by atomically rewriting config.toml
    # (api/config_store.rs write_atomic). A read-only bind-mount of the
    # file under a tmpfs causes the rename(2) to return EPERM, so we
    # bind-mount the parent dir RW from the host instead and let
    # `proxy-secret` + TLS-front fingerprints live alongside the
    # config. deploy.sh seeds telemt-data/config.toml from the repo
    # copy before the first `compose up`. The host file gets mutated
    # by telemt as users come and go — that's fine, the panvex agent
    # re-syncs from the control-plane DB on every boot.
    volumes:
      - ./telemt-data:/etc/telemt
    tmpfs:
      - /tmp:rw,mode=1777,size=16m
    ports:
      - "2443:2443"
    networks:
      - proxy
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/app/telemt", "healthcheck", "/etc/telemt/config.toml", "--mode", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "1.0"

  # Panvex agent. Lives in the `agent` compose profile so a plain
  # `docker compose up -d` brings up only backend + web + telemt — the
  # agent refuses to start until its state-file has been seeded by
  # `docker compose run --rm panvex-agent bootstrap …`. After that,
  # `docker compose --profile agent up -d` runs it.
  panvex-agent:
    image: panvex-agent:senko
    build:
      context: ../..
      dockerfile: Dockerfile
      target: agent
    container_name: panvex-agent
    restart: unless-stopped
    profiles:
      - agent
    depends_on:
      backend:
        condition: service_started
      telemt:
        condition: service_healthy
    volumes:
      - panvex_agent_state:/var/lib/panvex-agent
    # Share telemt's network namespace. The agent's telemt client
    # refuses any non-loopback endpoint (internal/agent/telemt/client.go
    # ErrNonLoopbackEndpoint) — the local API has minimal auth and
    # leaking it across the docker bridge would let any sibling
    # container manage proxy users. With network_mode=service:telemt
    # the agent reaches telemt on 127.0.0.1 and outbound gRPC to the
    # control-plane goes out through telemt's `proxy` network
    # attachment.
    network_mode: service:telemt
    command:
      - -state-file
      - /var/lib/panvex-agent/state.json
      - -telemt-url
      - http://127.0.0.1:9091
      - -telemt-metrics-url
      - http://127.0.0.1:9090
      - -node-name
      - vpn-senko
      - -version
      - senko
      - -fleet-group-id
      - default
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  panvex_sqlite_data:
  panvex_agent_state:

networks:
  proxy:
    external: true
